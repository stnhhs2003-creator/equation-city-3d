<style>

45deg,#ffe69b,#e7a34d)}.tile.chance{background:linear-gradient(145deg,#e7d1ff,#a58bd5)}.tile.rest{background:linear-gradient(145deg,#d9f0fa,#8abecf)}.tile.current{outline:3px solid white;filter:brightness(1.13);transform:translateZ(8px) scale(1.04);z-index:2}.tile.bounce{animation:jump .38s ease}@keyframes jump{50%{transform:translateY(-8px) scale(1.06)}}.tokens{display:flex;font-size:clamp(11px,1.7vw,17px);line-height:1}.center{grid-column:2/7;grid-row:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid #a4e6d2;border-radius:15px;background:radial-gradient(circle at 50% 30%,#527b7c,#1a374a 72%);box-shadow:inset 0 0 27px #071323aa;padding:10px;overflow:hidden}.art{font-size:clamp(28px,6vw,58px);filter:drop-shadow(0 5px #17263c)}.center h2{margin:4px 0;color:var(--gold);font-size:clamp(16px,2.8vw,23px)}.center p{max-width:360px;margin:3px;color:#e2f4e9;font-size:clamp(10px,1.4vw,13px);line-height:1.5}.law{margin-top:7px;padding:5px 9px;border-radius:10px;background:#0c243b99;border:1px solid #d8f4e377;color:#fff0c7;font-size:clamp(10px,1.35vw,13px);font-weight:850}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid #f3dda066;border-radius:14px;background:linear-gradient(145deg,#1a3049ee,#112139ee);box-shadow:0 6px #091426}.panel h3{margin:0 0 8px;color:var(--gold);font-size:16px}.players{display:grid;gap:6px}.player{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid #ffffff22;border-radius:10px;background:#ffffff08;font-size:12px}.player.active{border-color:var(--gold);background:#ffe09a18}.avatar{font-size:23px}.pinfo{flex:1}.pinfo b{display:block}.coins{white-space:nowrap;color:var(--gold);font-weight:950}.row{display:flex;align-items:center;gap:8px}.die{width:50px;height:50px;display:grid;place-items:center;border-radius:11px;background:#fff4d8;color:#25334b;font-size:29px;box-shadow:0 4px #b6a16d}.roll,.primary{flex:1;border:2px solid var(--gold);border-radius:11px;padding:11px;background:linear-gradient(145deg,#bd7047,#83503d);box-shadow:0 4px #55352f;font-weight:1000}.roll:disabled{opacity:.45}.hint{font-size:12px;color:#c7dcda;line-height:1.5}.feed{max-height:110px;overflow:auto;color:#d8eae2;font-size:12px}.feed div{padding:4px 0;border-bottom:1px solid #ffffff14}.guide{font-size:12px;line-height:1.55;color:#dcece4;margin:0}.modal{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:12px;background:#071321dd;backdrop-filter:blur(6px)}.modal.hide{display:none}.dialog{width:min(570px,100%);max-height:95dvh;overflow:auto;padding:clamp(15px,3.5vw,24px);border:3px solid var(--gold);border-radius:19px;text-align:center;background:linear-gradient(150deg,#29485e,#14243b);box-shadow:0 14px 38px #0009}.dialog h2{margin:4px 0 8px;color:var(--gold);font-size:clamp(22px,5vw,30px)}.dialog p{color:#deefe6;line-height:1.5}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0;text-align:left}.form label{font-size:13px;font-weight:850}.form select,.form input{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #bdebd7;border-radius:9px;background:#203b52;color:#fff}.names{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.problem{margin:12px 0;padding:13px 8px;border:1px solid #fff1c477;border-radius:14px;background:#10243a;color:#fff3d1;font-size:clamp(27px,6vw,42px);font-weight:1000;line-height:1.65}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;font-size:.82em;line-height:1;margin:0 .1em}.frac span:first-child{padding:0 .15em .05em;border-bottom:2px solid currentColor}.frac span:last-child{padding:.04em .15em 0}.problem sup{font-size:.58em;vertical-align:super;line-height:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.choice{min-height:50px;border:2px solid #a7d7c5;border-radius:11px;background:#214359;font-size:clamp(17px,4vw,22px);font-weight:950}.choice.correct{background:#28795f;border-color:#b7f1c9}.choice.wrong{background:#904c50;border-color:#ffc4ad}.choice:disabled{cursor:default}.explain{padding:10px;border:1px solid #a3e4d277;border-radius:10px;background:#10293e;color:#e5f3e9;font-size:13px;text-align:left;line-height:1.5}.bar{height:7px;border-radius:9px;background:#ffffff22;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#69e1bf,#ffe08b);transform-origin:left}.tiny{font-size:11px;color:#bfd3d5}@media(max-width:760px){.layout{grid-template-columns:1fr}.board-wrap{padding:2px}.board{width:min(100%,630px);gap:3px;padding:6px;border-width:4px}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:first-child{grid-column:1/-1}.panel{padding:9px}.feed{max-height:75px}}@media(max-width:430px){.app{padding:8px}.board{gap:2px;padding:4px;border-width:3px}.tile{border-width:1px;border-radius:5px}.tile .n{font-size:7px}.center{padding:5px}.center p{font-size:10px}.side{grid-template-columns:1fr}.side .panel:first-child{grid-column:auto}.form{gap:6px}.names{grid-template-columns:1fr}.choices{gap:6px}}

<body><main class="app">
<header><div class="brand">🍰 分數指數城<small>FRACTION × EXPONENT · MATH CITY QUEST</small></div><div class="actions"><a class="soft" href="../" style="text-decoration:none">↩ 城市首頁</a><button class="soft" id="help">玩法</button><button class="soft" id="sound">♫ 音效 開</button><span class="stat" id="turn">回合 —</span><span class="stat" id="time">⏱ —</span></div></header>
<div class="layout"><section class="board-wrap"><div class="board" id="board"><div class="center"><div class="art">🏙️🍰🧮</div><h2 id="headline">分數指數城冒險</h2><p id="centertext">答對指數與分數混合題，擲骰前進，率先抵達勝利廣場！</p><div class="law">同底數相乘：指數相加　｜　乘方的乘方：指數相乘</div></div></div></section>
<aside class="side"><section class="panel"><h3>🧑‍🤝‍🧑 冒險隊伍</h3><div class="players" id="players"><p class="hint">開始冒險後，隊伍會顯示在這裡。</p></div></section>
<section class="panel"><h3>🎲 城市移動</h3><div class="row"><div class="die" id="die">⚀</div><button class="roll" id="roll" disabled>先答題</button></div><p class="hint" id="rollhint">答對才能擲骰前進</p><button class="soft" id="restart" style="width:100%">↻ 新冒險</button></section>
<section class="panel"><h3>📜 城市記事</h3><div class="feed" id="feed"><div>答題、擲骰與機會事件會記錄在這裡。</div></div></section>
<section class="panel"><h3>📘 指數小抄</h3><p class="guide">a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup><br>a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup><br>(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup><br>先算指數，再做分數乘除加減；答案約成最簡分數。</p></section></aside></div></main>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),board=$('board'),modal=$('modal'),dialog=$('dialog');
const squares=[['🚩','起點'],['🍓','草莓塔'],['🍰','分數甜點'],['🧁','指數烘焙'],['🎁','機會卡'],['🏪','約分商店'],['🍇','葡萄街'],['🧮','指數學院'],['🌿','休息花園'],['🍮','布丁橋'],['🎁','機會卡'],['🍩','甜甜圈路'],['🏰','分數城堡'],['🍋','檸檬廣場'],['🌿','休息花園'],['🧁','乘方巷'],['🎁','機會卡'],['🚉','分數車站'],['🍒','櫻桃大道'],['🌉','最簡分數橋'],['🎁','機會卡'],['🎡','數學摩天輪'],['🍬','糖果市集'],['🏆','勝利廣場']];
const avatars=['🧙','🦊','🐼','🐲'],lvdata={easy:{name:'分數指數新手',time:45,points:100,extra:0},normal:{name:'城市探險',time:35,points:150,extra:1},hard:{name:'指數大師',time:27,points:230,extra:2}};
let ps=[],turn=0,round=1,started=false,locked=false,answered=false,level='normal',hint='show',qsec=0,gsec=600,qt=null,gt=null,audio=null,sound=true,token=0;
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)||1}function R(n,d){d=d||1;if(d<0){n=-n;d=-d}let g=gcd(n,d);return{n:n/g,d:d/g}}function add(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d)}function sub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d)}function mul(a,b){return R(a.n*b.n,a.d*b.d)}function div(a,b){return R(a.n*b.d,a.d*b.n)}function pow(a,n){return R(a.n**n,a.d**n)}function fmt(a){return a.d===1?''+a.n:a.n+'/'+a.d}function F(n,d){return d===1?''+n:'<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>'}function Q(n,d,e){return '('+F(n,d)+')<sup>'+e+'</sup>'}function pick(a){return a[Math.floor(Math.random()*a.length)]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeQ(){let cases=[
()=>{let b=pick([[2,3],[3,4],[2,5],[1,2]]),m=pick([1,2]),n=pick([2,3]),v=pow(R(b[0],b[1]),m+n);return{html:Q(b[0],b[1],m)+' × '+Q(b[0],b[1],n),v:v,why:'同底數相乘，指數相加：'+m+'+'+n+'='+ (m+n)+'，再計算分數次方。'}},
()=>{let b=pick([[2,3],[3,4],[2,5],[1,2]]),m=pick([2,3,4]),n=pick([1,2]);if(n>m)n=1;let v=pow(R(b[0],b[1]),m-n);return{html:Q(b[0],b[1],m)+' ÷ '+Q(b[0],b[1],n),v:v,why:'同底數相除，指數相減：'+m+'−'+n+'='+(m-n)+'，答案為 '+fmt(v)+'。'}},
()=>{let b=pick([[2,3],[3,4],[1,2]]),m=pick([1,2]),n=pick([2,3]),v=pow(R(b[0],b[1]),m*n);return{html:'['+Q(b[0],b[1],m)+']<sup>'+n+'</sup>',v:v,why:'乘方的乘方，指數相乘：'+m+'×'+n+'='+(m*n)+'，答案為 '+fmt(v)+'。'}},
()=>{let x=pick([2,3]),m=pick([1,2]),v=add(pow(R(1,x),m),R(1,x));return{html:Q(1,x,m)+' + '+F(1,x),v:v,why:'先算分數的乘方，再和 '+F(1,x)+' 通分相加，答案為 '+fmt(v)+'。'}},
()=>{let x=pick([2,3]),m=pick([1,2,3]),v=mul(R(x),pow(R(1,x),m+1));return{html:''+x+' × '+Q(1,x,m+1),v:v,why:'把整數改寫成同底數的分數，合併指數後答案是 '+fmt(v)+'。'}},
()=>{let a=pick([2,3]),b=pick([3,4,5]),m=pick([1,2]),v=mul(pow(R(a,b),m),R(b,a));return{html:Q(a,b,m)+' × '+F(b,a),v:v,why:'先算分數乘方，再與倒數相乘並約分，答案為 '+fmt(v)+'。'}}
];let q=pick(cases)();return q}
function options(v){let xs=[v,add(v,R(1,2)),sub(v,R(1,2)),mul(v,R(2)),add(v,R(1,3)),div(R(1),v)],m=new Map();xs.forEach(x=>{if(x.n>0&&x.n<100000&&x.d<100000)m.set(fmt(x),x)});m.set(fmt(v),v);let all=[...m.values()];for(let i=1;all.length<4;i++){let x=add(v,R(i,7));m.set(fmt(x),x);all=[...m.values()]}return all.slice(0,4).map(x=>({text:fmt(x),ok:fmt(x)===fmt(v)})).sort(()=>Math.random()-.5)}
function build(){document.querySelectorAll('.tile').forEach(e=>e.remove());let c=[];for(let x=1;x<=7;x++)c.push([1,x]);for(let y=2;y<=7;y++)c.push([y,7]);for(let x=6;x>=1;x--)c.push([7,x]);for(let y=6;y>=2;y--)c.push([y,1]);c.forEach((p,i)=>{let d=document.createElement('div');d.className='tile '+(i===0?'start':i===23?'finish':[4,10,16,20].includes(i)?'chance':[8,14].includes(i)?'rest':'');d.dataset.i=i;d.style.gridRow=p[0];d.style.gridColumn=p[1];d.innerHTML='<span class="n">'+i+'</span><span class="emoji">'+squares[i][0]+'</span><span class="label">'+squares[i][1]+'</span><div class="tokens"></div>';board.appendChild(d)})}
function render(){if(!ps.length)return;document.querySelectorAll('.tokens').forEach(e=>e.textContent='');ps.forEach(p=>{let e=document.querySelector('.tile[data-i="'+p.pos+'"] .tokens');if(e)e.textContent+=p.avatar});document.querySelectorAll('.tile.current').forEach(e=>e.classList.remove('current'));document.querySelector('.tile[data-i="'+ps[turn].pos+'"]')?.classList.add('current');$('players').innerHTML=ps.map((p,i)=>'<div class="player '+(i===turn?'active':'')+'"><span class="avatar">'+p.avatar+'</span><div class="pinfo"><b>'+esc(p.name)+'</b><span>第 '+(p.pos+1)+' 格 · 答對 '+p.correct+' 題</span></div><span class="coins">🪙 '+p.coins+'</span></div>').join('');$('turn').textContent='回合 '+round;}
function note(s){let e=$('feed');e.insertAdjacentHTML('afterbegin','<div>'+s+'</div>');while(e.children.length>14)e.lastElementChild.remove()}
function beep(f,d){if(!sound)return;try{audio||(audio=new(window.AudioContext||window.webkitAudioContext)());let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function setup(){let n=+$('count').value,box=$('names');box.innerHTML='';for(let i=0;i<n;i++)box.innerHTML+='<label>玩家 '+(i+1)+'<input id="p'+i+'" value="'+['橙浪','翠時','藍雪','墨羽'][i]+'" maxlength="10"></label>'}
function startScreen(){dialog.innerHTML='<div class="art">🏙️🍰</div><h2>歡迎來到分數指數城</h2><p>答對混合題才能擲骰。收集金幣、抽機會卡，率先抵達勝利廣場！</p><div class="form"><label>玩家人數<select id="count"><option value="2">2 位</option><option value="3">3 位</option><option value="4">4 位</option></select></label><label>難度<select id="difficulty"><option value="easy">分數指數新手</option><option value="normal" selected>城市探險</option><option value="hard">指數大師</option></select></label><label>整局限時<select id="duration"><option value="600">10 分鐘</option><option value="900">15 分鐘</option><option value="1200">20 分鐘</option></select></label><label>答錯後<select id="hint"><option value="show">顯示詳解</option><option value="quiet">只顯示正解</option></select></label></div><div class="names" id="names"></div><p class="tiny">同一台電腦輪流操作，玩家名稱請使用暱稱。</p><button class="primary" id="go">🚀 開始冒險</button>';modal.classList.remove('hide');setup();$('count').onchange=setup;$('go').onclick=begin}
function begin(){level=$('difficulty').value;hint=$('hint').value;ps=Array.from({length:+$('count').value},(_,i)=>({name:$('p'+i).value.trim()||('玩家'+(i+1)),avatar:avatars[i],pos:0,coins:0,correct:0,skip:0}));turn=0;round=1;started=true;answered=false;locked=false;gsec=+$('duration').value;clearInterval(qt);clearInterval(gt);token++;modal.classList.add('hide');$('centertext').textContent='先解題，再擲骰。到達第 24 格勝利廣場即獲勝。';$('roll').disabled=true;render();note('🚀 冒險開始！答對才能移動。');gt=setInterval(()=>{if(!started)return;gsec--;let m=Math.floor(gsec/60),s=gsec%60;$('time').textContent='⏱ '+m+':'+('0'+s).slice(-2);if(gsec<=0)timeUp()},1000);ask()}
function ask(){if(!started||locked)return;locked=true;answered=false;let q=makeQ(),opts=options(q.v),p=ps[turn],max=lvdata[level].time,sec=max;dialog.innerHTML='<div class="tiny">'+p.avatar+' '+esc(p.name)+' 的回合 · <span id="sec">'+sec+'</span> 秒</div><div class="bar"><span id="bar"></span></div><h2>分數 × 指數律混合題</h2><div class="problem">'+q.html+' = ?</div><p>選出最簡分數或整數答案</p><div class="choices">'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+o.text.replace('/','／')+'</button>').join('')+'</div><div id="feedback"></div>';modal.classList.remove('hide');document.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>answer(i,opts,q));qt=setInterval(()=>{sec--;if($('sec'))$('sec').textContent=sec;if($('bar'))$('bar').style.transform='scaleX('+Math.max(0,sec/max)+')';if(sec<=0){clearInterval(qt);answer(-1,opts,q)}},1000)}
function answer(i,opts,q){if(!locked||answered)return;answered=true;clearInterval(qt);let ok=i>=0&&opts[i].ok,p=ps[turn];document.querySelectorAll('.choice').forEach((b,j)=>{if(opts[j].ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong');b.disabled=true});if(ok){let score=lvdata[level].points+Math.max(0,Math.floor((+$('sec')?.textContent||0)*2));p.coins+=score;p.correct++;beep(700,.18);$('feedback').innerHTML='<div class="explain"><b>答對！獲得 '+score+' 金幣。</b><br>'+q.why+'</div><button class="primary" id="goRoll" style="margin-top:9px">🎲 擲骰前進</button>';note('✅ '+esc(p.name)+' 答對，獲得 '+score+' 金幣。');$('goRoll').onclick=()=>{modal.classList.add('hide');locked=false;$('roll').disabled=false;$('roll').textContent='🎲 擲骰前進';render()}}else{beep(180,.25);$('feedback').innerHTML='<div class="explain"><b>'+(i<0?'時間到':'再接再厲')+'！正解：'+fmt(q.v)+'</b>'+(hint==='show'?'<br>'+q.why:'')+'<br>本回合停留，換下一位。</div><button class="soft" id="next" style="width:100%;margin-top:9px">➡️ 下一位</button>';note('❌ '+esc(p.name)+' 未答對，停留一回合。');$('next').onclick=next}}
function roll(){if(!started||locked||!answered)return;let p=ps[turn];locked=true;$('roll').disabled=true;let d=1,k=0,a=['⚀','⚁','⚂','⚃','⚄','⚅'],spin=setInterval(()=>{$('die').textContent=a[k++%6];if(k>8){clearInterval(spin);d=1+Math.floor(Math.random()*6);$('die').textContent=a[d-1];let move=d+lvdata[level].extra;note('🎲 '+esc(p.name)+' 擲出 '+d+' 點，前進 '+move+' 格。');walk(p,Math.min(23,p.pos+move),token)}},65)}
function walk(p,target,t){function step(){if(t!==token)return;if(p.pos<target){p.pos++;render();beep(430,.06);setTimeout(step,110)}else{let e=document.querySelector('.tile[data-i="'+p.pos+'"]');e?.classList.add('bounce');note(p.avatar+' '+esc(p.name)+' 抵達「'+squares[p.pos][1]+'」。');if(p.pos>=23){win(p);return}setTimeout(()=>land(p),350)}}step()}
function land(p){let i=p.pos;if([4,10,16,20].includes(i)){let cards=[()=>{p.coins+=80;return'🎁 金幣袋 +80。'},()=>{p.pos=Math.min(23,p.pos+2);return'🚀 指數火箭前進 2 格！'},()=>{p.skip=1;return'🌧️ 暴雨來襲，下次停留一回合。'},()=>{p.coins+=120;return'📗 獎學金 +120。'},()=>{p.pos=Math.max(0,p.pos-2);return'🌀 走錯巷子，退後 2 格。'}];let msg=pick(cards)();$('headline').textContent=msg;note(msg);render();if(p.pos>=23){setTimeout(()=>win(p),500);return}}else if([8,14].includes(i)){p.coins+=45;note('🌿 花園補給 +45 金幣。');render()}else{p.coins+=20;render()}setTimeout(next,700)}
function next(){if(!started)return;locked=false;answered=false;clearInterval(qt);turn=(turn+1)%ps.length;if(turn===0)round++;if(ps[turn].skip){ps[turn].skip--;note('⏸️ '+esc(ps[turn].name)+' 停留一回合。');render();setTimeout(next,400);return}render();ask()}
function win(p){if(!started)return;started=false;clearInterval(qt);clearInterval(gt);beep(880,.4);$('headline').textContent=p.name+' 抵達勝利廣場！';$('centertext').textContent='收集 '+p.coins+' 金幣，答對 '+p.correct+' 題。';modal.classList.remove('hide');dialog.innerHTML='<div class="art">🏆🎉</div><h2>城市冒險冠軍！</h2><p>'+p.avatar+' <b>'+esc(p.name)+'</b> 第一位抵達勝利廣場！</p><div class="explain">金幣：'+p.coins+'　答對題數：'+p.correct+'</div><button class="primary" id="again" style="margin-top:10px">🔁 再玩一局</button>';$('again').onclick=startScreen;note('🏆 '+esc(p.name)+' 贏得冒險！')}
function timeUp(){if(!started)return;started=false;clearInterval(qt);const rank=[...ps].sort((a,b)=>b.pos-a.pos||b.coins-a.coins||b.correct-a.correct);modal.classList.remove('hide');dialog.innerHTML='<div class="art">⏰</div><h2>時間到！</h2><div class="explain">'+rank.map((p,i)=>(i+1)+'. '+esc(p.name)+'｜第 '+(p.pos+1)+' 格｜金幣 '+p.coins+'｜答對 '+p.correct).join('<br>')+'</div><p>本局冠軍：'+esc(rank[0].name)+'</p><button class="primary" id="again">🔁 再玩一局</button>';$('again').onclick=startScreen}
function help(){modal.classList.remove('hide');dialog.innerHTML='<div class="art">📘</div><h2>玩法與指數小抄</h2><div class="explain">解題答對 → 得金幣 → 擲骰前進。答錯或逾時就換下一位。<br><br>同底數相乘：a<sup>m</sup>×a<sup>n</sup>=a<sup>m+n</sup><br>同底數相除：a<sup>m</sup>÷a<sup>n</sup>=a<sup>m−n</sup><br>乘方的乘方：(a<sup>m</sup>)<sup>n</sup>=a<sup>mn</sup><br><br>先算指數，再做分數運算；答案約成最簡分數。抵達勝利廣場獲勝。</div><button class="primary" id="close" style="margin-top:10px">回到遊戲</button>';$('close').onclick=()=>{modal.classList.add('hide');if(started&&!locked)ask()}}
$('roll').onclick=roll;$('restart').onclick=startScreen;$('help').onclick=()=>{if(started){$('headline').textContent='回合結束後再查看玩法';return}help()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ 音效 開':'♫ 音效 關';beep(600,.1)};
build();startScreen()
})();
</script></body></html>
